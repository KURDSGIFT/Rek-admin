name: Daily Firebase Backup
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Data from Firebase
        run: |
          python3 - <<EOF
          import urllib.request
          # پێناسەکردنی زانیارییەکان بە جیا بۆ ئەوەی هیچ بۆشاییەک دروست نەبێت
          project = "appmass-f26bd"
          db = "(default)"
          url = f"https://firestore.googleapis.com/v1/projects/{project}/databases/{db}/documents/foods"
          # سڕینەوەی هەر بۆشاییەکی شاراوە
          clean_url = url.replace(' ', '' ).strip()
          print(f"Fetching from: {clean_url}")
          urllib.request.urlretrieve(clean_url, 'foods_backup.json')
          EOF

      - name: Commit and Push Backup
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add foods_backup.json
          git commit -m "Daily Backup: $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push
